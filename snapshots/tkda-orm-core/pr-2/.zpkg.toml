[package]
org = "takoda-automation"
name = "tkda-orm-core"
version = "0.1.0"
description = "Takoda Automation private durable ORM and fenced run persistence"
license = "MIT"

[package.repository]
vcs = "git"
url = "https://github.com/takoda-automation/tkda-orm-core"

[dependencies]
"takoda-automation/tkda-interfaces" = "^0.1.0"
"takoda-automation/tkda-lib-core" = "^0.1.0"

[install]
adapter = "none"
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [
  ".env",
  ".env.*",
  ".direnv/**",
  ".vendor/.zed/**",
  ".zed/**",
  ".zed-pack/**",
  "tmp/**",
  "**/*.log",
  ".DS_Store",
  "**/target/**"
]
