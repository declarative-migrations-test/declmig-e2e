[package]
name = "tkda-orm-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/takoda-automation/tkda-orm-core"

[features]
default = ["sea-orm"]
sea-orm = ["dep:sea-orm"]
diesel-parity = ["dep:diesel"]
full = ["sea-orm", "diesel-parity"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sea-orm = { version = "1.1", optional = true, default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-json", "with-uuid"] }
diesel = { version = "2.3", optional = true, default-features = false, features = ["postgres", "chrono", "serde_json", "uuid", "32-column-tables"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
