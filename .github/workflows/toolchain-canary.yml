name: toolchain-canary

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: toolchain-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Verify exact contributor head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
          components: rustfmt,clippy
      - name: Exercise Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
      - name: Verify clean tracked state
        run: git diff --exit-code

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Verify exact contributor head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Exercise Go toolchain
        run: |
          go version
          printf 'package main\nimport "fmt"\nfunc main(){fmt.Println("ok")}\n' > /tmp/canary.go
          go run /tmp/canary.go
      - name: Verify clean tracked state
        run: git diff --exit-code

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - name: Verify exact contributor head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Exercise Python toolchain
        run: |
          python --version
          python - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 13)
          print("ok")
          PY
      - name: Verify clean tracked state
        run: git diff --exit-code
