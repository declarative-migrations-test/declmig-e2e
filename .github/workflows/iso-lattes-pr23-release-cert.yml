name: ISO Lattes PR23 release-policy certification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-lattes-pr23-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out funded carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact ISO policy blob
        run: |
          set -euo pipefail
          test "$(git hash-object cert/pr64/fixtures/iso-lattes-pr23.json)" = "780d2ec5beff4f3467421148add0c73028bfe761"
          printf '%s\n' "iso_head=11061cbc860f0f801b6b74c080db166e5ab9f259"
      - name: Install Rust 1.82
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.82.0
          components: rustfmt,clippy
      - name: Resolve dependencies
        working-directory: cert/pr64
        run: cargo generate-lockfile
      - name: Run exact policy conformance test
        working-directory: cert/pr64
        run: cargo test -p pr64-policy-cert --test iso_lattes
