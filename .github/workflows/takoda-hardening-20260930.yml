name: Takoda hardening exact-head certification

on:
  push:
    branches:
      - cert/takoda-hardening-20260930

permissions:
  contents: read

concurrency:
  group: takoda-hardening-20260930-${{ github.sha }}
  cancel-in-progress: true

jobs:
  browser-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require fleet read credential
        shell: bash
        env:
          FLEET_GITHUB_READ_TOKEN: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${FLEET_GITHUB_READ_TOKEN:-}" || exit 78
      - name: Check out exact browser-worker head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: takoda-automation/tkda-browser-workers.ts
          ref: 2af5925b4a0f5e6bab715e05c71b095cee8e1617
          path: source
          token: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - run: test "$(git -C source rev-parse HEAD)" = "2af5925b4a0f5e6bab715e05c71b095cee8e1617"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: source
        run: npm run typecheck
      - working-directory: source
        run: npm run build
      - working-directory: source
        run: npm test
      - working-directory: source
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  rust-heads:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: monorepo
            repository: takoda-automation/tkda-monorepo
            sha: 5f0dca4d85b8b1139ff3dea8cdbb4052b554f624
            workdir: tools/tkda-monorepo-tool
            locked: "true"
          - name: mcp
            repository: takoda-automation/tkda-mcp-server.rs
            sha: 4c42c9766271c0f2896b4e9a07c411a3f006b3fc
            workdir: .
            locked: "false"
          - name: daemon
            repository: takoda-automation/tkda-desktop-daemon
            sha: daf01a9bbc1cb2c40027b9ba007a4eb1b2e76e86
            workdir: .
            locked: "false"
          - name: api
            repository: takoda-automation/tkda-api-server.rs
            sha: 7f92cd036b88aa85d57f662ee9f80fabd26998ad
            workdir: .
            locked: "true"
    name: rust-${{ matrix.name }}
    steps:
      - name: Require fleet read credential
        shell: bash
        env:
          FLEET_GITHUB_READ_TOKEN: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${FLEET_GITHUB_READ_TOKEN:-}" || exit 78
      - name: Check out exact private head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          path: source
          token: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - name: Verify exact source
        shell: bash
        run: test "$(git -C source rev-parse HEAD)" = "${{ matrix.sha }}"
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Formatting
        working-directory: source/${{ matrix.workdir }}
        run: cargo fmt --all -- --check
      - name: Check
        if: matrix.locked == 'false'
        working-directory: source/${{ matrix.workdir }}
        run: cargo check --all-targets --all-features
      - name: Check locked
        if: matrix.locked == 'true'
        working-directory: source/${{ matrix.workdir }}
        run: cargo check --locked --all-targets --all-features
      - name: Clippy
        if: matrix.locked == 'false'
        working-directory: source/${{ matrix.workdir }}
        run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::needless_return
      - name: Clippy locked
        if: matrix.locked == 'true'
        working-directory: source/${{ matrix.workdir }}
        run: cargo clippy --locked --all-targets --all-features -- -D warnings -A clippy::needless_return
      - name: Tests
        if: matrix.locked == 'false'
        working-directory: source/${{ matrix.workdir }}
        run: cargo test --all-targets --all-features
      - name: Tests locked
        if: matrix.locked == 'true'
        working-directory: source/${{ matrix.workdir }}
        run: cargo test --locked --all-targets --all-features
      - name: Verify source stayed clean
        working-directory: source
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require fleet read credential
        shell: bash
        env:
          FLEET_GITHUB_READ_TOKEN: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${FLEET_GITHUB_READ_TOKEN:-}" || exit 78
      - name: Check out exact sync head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: takoda-automation/tkda-sync
          ref: f62bd2dc58287890f961e2f80b49d87da58b56f5
          path: source
          token: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - run: test "$(git -C source rev-parse HEAD)" = "f62bd2dc58287890f961e2f80b49d87da58b56f5"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Verify all Rust crates
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          for dir in . execution-receipt/rust execution-materializer/rust fetch-policy/rust; do
            (
              cd "$dir"
              cargo fmt --all -- --check
              cargo check --all-targets --all-features
              cargo clippy --all-targets --all-features -- -D warnings -A clippy::needless_return
              cargo test --all-targets --all-features
            )
          done
      - name: Verify source stayed clean
        working-directory: source
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
