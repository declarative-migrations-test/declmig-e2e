name: quota-admission-contract

on:
  pull_request:
    paths:
      - "tests/quota_admission_contract.py"
      - ".github/workflows/quota-admission-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quota-admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact certification head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile reference model
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/quota_admission_contract.py

      - name: Verify quota and admission invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/quota_admission_contract.py
