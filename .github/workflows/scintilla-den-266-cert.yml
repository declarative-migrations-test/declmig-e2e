name: Scintilla DEN-266 certification

on:
  pull_request:
    paths:
      - fixtures/scintilla-desktop-daemon/**
      - .github/workflows/scintilla-den-266-cert.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fixtures/scintilla-desktop-daemon
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
      - name: Generate deterministic lockfile
        run: cargo +1.90.0 generate-lockfile
      - name: Format
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +1.90.0 test --locked --all-targets
      - name: Publish lock candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scintilla-cargo-lock
          path: fixtures/scintilla-desktop-daemon/Cargo.lock
          if-no-files-found: error
