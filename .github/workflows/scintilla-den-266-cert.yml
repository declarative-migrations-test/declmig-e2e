name: Scintilla DEN-266 certification

on:
  pull_request:
    paths:
      - fixtures/scintilla-desktop-daemon/**
      - .github/workflows/scintilla-den-266-cert.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fixtures/scintilla-desktop-daemon
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
      - name: Generate deterministic lockfile
        run: cargo +1.90.0 generate-lockfile
      - name: Publish lock candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scintilla-cargo-lock
          path: fixtures/scintilla-desktop-daemon/Cargo.lock
          if-no-files-found: error
      - name: Commit generated lock evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "DEN-266 capture generated Scintilla Cargo.lock [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
      - name: Format
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.90.0 clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +1.90.0 test --locked --all-targets
